<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 44" width="1000" height="44" role="img" aria-label="Build, refine, ship, repeat."><title>Build, refine, ship, repeat.</title><style>@font-face{font-family:mono;src:url(data:font/woff2;base64,) format("woff2")}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fade{opacity:0;animation:fade .8s ease forwards}
@keyframes fade{to{opacity:1}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.8s cubic-bezier(.6,0,.2,1) .3s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.breathe{animation:breathe 5s ease-in-out infinite}
@keyframes breathe{50%{opacity:.55}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 8s cubic-bezier(.7,0,.3,1) infinite}
@keyframes spin{0%,70%{transform:rotate(0)}85%,100%{transform:rotate(90deg)}}
.grow{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.2s cubic-bezier(.6,0,.2,1) .2s forwards}
@keyframes grow{to{transform:scaleX(1)}}
.nudge{animation:nudge 5s ease-in-out infinite}
@keyframes nudge{0%,78%,100%{transform:none}86%{transform:translate(4px,-4px)}}
.pulse{animation:pulse 3.6s ease-in-out infinite}
.slot{transform:translateY(56px);animation:slot 1s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes slot{to{transform:none}}
.led{opacity:.18;animation:led 6.4s infinite}
@keyframes led{0%,2%{opacity:.18}5%,11%{opacity:1}16%,100%{opacity:.18}}
.cell{opacity:0;animation:fade .5s ease forwards}
.scan{animation:scan 9s linear infinite}
@keyframes scan{from{transform:translateX(-120px)}to{transform:translateX(1120px)}}
@keyframes pulse{0%,100%{opacity:.35}12%,30%{opacity:1}45%{opacity:.35}}
.word{opacity:.32;animation:lit 6s infinite}@keyframes lit{0%,4%{opacity:.32}8%,26%{opacity:1}32%,100%{opacity:.32}}.run{animation:run 3.5s cubic-bezier(.5,0,.5,1) infinite}@keyframes run{from{transform:translateX(-90px)}to{transform:translateX(573px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0" y="16" width="13" height="13" fill="#111111" class="pulse"/><rect x="34" y="22" width="573" height="1" fill="#444444" opacity=".45"/><defs><linearGradient id="seg"><stop offset="0" stop-color="#111111" stop-opacity="0"/><stop offset=".8" stop-color="#111111"/><stop offset="1" stop-color="#111111" stop-opacity="0"/></linearGradient><clipPath id="ln"><rect x="34" y="20" width="573" height="5"/></clipPath></defs><g clip-path="url(#ln)"><rect x="34" y="21.5" width="90" height="2" fill="url(#seg)" class="run"/></g><text x="643" y="28" font-family="mono" font-size="14" fill="#111111" letter-spacing="3.5" class="word" style="animation-delay:0s">BUILD</text><text x="714.4" y="28" font-family="mono" font-size="14" fill="#5f5f5f" letter-spacing="3.5">→</text><text x="738.2" y="28" font-family="mono" font-size="14" fill="#111111" letter-spacing="3.5" class="word" style="animation-delay:1.5s">REFINE</text><text x="821.5" y="28" font-family="mono" font-size="14" fill="#5f5f5f" letter-spacing="3.5">→</text><text x="845.3" y="28" font-family="mono" font-size="14" fill="#111111" letter-spacing="3.5" class="word" style="animation-delay:3s">SHIP</text><text x="904.8" y="28" font-family="mono" font-size="14" fill="#5f5f5f" letter-spacing="3.5">→</text><text x="928.6" y="28" font-family="mono" font-size="14" fill="#111111" letter-spacing="3.5" class="word" style="animation-delay:4.5s">REPEAT</text></svg>
