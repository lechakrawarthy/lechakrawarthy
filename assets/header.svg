<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t"><title id="t">Chakrawarthy. Most of what I build runs on a server. Some of it runs in your terminal.</title><style>
:root{--bg:#0d1117;--card:#161b22;--chip:#21262d;--line:#30363d;--line2:#21262d;--fg:#e6edf3;--mute:#8b949e;--dim:#6e7681;--acc:#f78166;--ok:#3fb950}
