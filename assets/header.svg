<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t">
  <title id="t">Chakrawarthy. Most of what I build runs on a server. Some of it runs in your terminal.</title>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#21262d"/>
    </pattern>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#f78166" stop-opacity=".22"/>
      <stop offset="1" stop-color="#f78166" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <style>
    .name{font:700 60px 'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;fill:#e6edf3;letter-spacing:-1px}
    .tag{font:400 21px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#8b949e}
    .hi{fill:#f78166}
    .sub{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#f78166;letter-spacing:3px}
    .term{font:400 13.5px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#c9d1d9}
    .dim{fill:#6e7681}
    .ok{fill:#3fb950}
    .led{animation:blink 1.8s infinite}
    .d1{animation-delay:.4s}.d2{animation-delay:.9s}.d3{animation-delay:1.3s}
    @keyframes blink{0%,55%{opacity:1}65%,85%{opacity:.15}100%{opacity:1}}
    .cursor{animation:cur 1.1s steps(1) infinite}
    @keyframes cur{50%{opacity:0}}
    .l1{animation:a1 9s infinite}.l2{animation:a2 9s infinite}.l3{animation:a3 9s infinite}
    .l4{animation:a4 9s infinite}.l5{animation:a5 9s infinite}.l6{animation:a6 9s infinite}
    @keyframes a1{0%,4%{opacity:0}6%,94%{opacity:1}100%{opacity:0}}
    @keyframes a2{0%,16%{opacity:0}18%,94%{opacity:1}100%{opacity:0}}
    @keyframes a3{0%,24%{opacity:0}26%,94%{opacity:1}100%{opacity:0}}
    @keyframes a4{0%,30%{opacity:0}32%,94%{opacity:1}100%{opacity:0}}
    @keyframes a5{0%,36%{opacity:0}38%,94%{opacity:1}100%{opacity:0}}
    @keyframes a6{0%,46%{opacity:0}48%,94%{opacity:1}100%{opacity:0}}
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="#0d1117"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <circle cx="975" cy="150" r="260" fill="url(#glow)"/>

    <!-- server rack -->
    <rect x="62" y="70" width="132" height="176" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <g fill="#0d1117" stroke="#30363d" stroke-width="1.5">
      <rect x="74" y="82" width="108" height="24" rx="4"/>
      <rect x="74" y="114" width="108" height="24" rx="4"/>
      <rect x="74" y="146" width="108" height="24" rx="4"/>
      <rect x="74" y="178" width="108" height="24" rx="4"/>
      <rect x="74" y="210" width="108" height="24" rx="4"/>
    </g>
    <path d="M84 94h40M84 126h40M84 158h40M84 190h40M84 222h40" stroke="#30363d" stroke-width="2" stroke-linecap="round"/>
    <g>
      <circle class="led" cx="158" cy="94" r="3.5" fill="#3fb950"/>
      <circle class="led d2" cx="170" cy="94" r="3.5" fill="#f78166"/>
      <circle class="led d1" cx="158" cy="126" r="3.5" fill="#3fb950"/>
      <circle class="led d3" cx="170" cy="126" r="3.5" fill="#3fb950"/>
      <circle class="led d2" cx="158" cy="158" r="3.5" fill="#3fb950"/>
      <circle class="led" cx="170" cy="158" r="3.5" fill="#f78166"/>
      <circle class="led d3" cx="158" cy="190" r="3.5" fill="#3fb950"/>
      <circle class="led d1" cx="170" cy="190" r="3.5" fill="#3fb950"/>
      <circle class="led d1" cx="158" cy="222" r="3.5" fill="#3fb950"/>
      <circle class="led d2" cx="170" cy="222" r="3.5" fill="#f78166"/>
    </g>

    <!-- trace: server to terminal -->
    <path id="trace" d="M128 246v34h847v-24" fill="none" stroke="#f78166" stroke-opacity=".3" stroke-width="2" stroke-dasharray="2 7"/>
    <circle cx="128" cy="280" r="4" fill="none" stroke="#f78166" stroke-opacity=".5" stroke-width="1.5"/>
    <circle cx="975" cy="280" r="4" fill="none" stroke="#f78166" stroke-opacity=".5" stroke-width="1.5"/>
    <circle r="4.5" fill="#f78166">
      <animateMotion dur="4.5s" repeatCount="indefinite"><mpath xlink:href="#trace"/></animateMotion>
    </circle>

    <!-- words -->
    <text x="236" y="128" class="name">Chakrawarthy</text>
    <text x="240" y="174" class="tag">Most of what I build runs on a <tspan class="hi">server</tspan>.</text>
    <text x="240" y="206" class="tag">Some of it runs in your <tspan class="hi">terminal</tspan>.</text>
    <text x="240" y="244" class="sub">FULL-STACK · AI &amp; ML · HYDERABAD × BENGALURU</text>

    <!-- terminal -->
    <rect x="795" y="58" width="360" height="198" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <path d="M795 86h360" stroke="#30363d" stroke-width="1.5"/>
    <circle cx="815" cy="72" r="5" fill="#484f58"/>
    <circle cx="833" cy="72" r="5" fill="#484f58"/>
    <circle cx="851" cy="72" r="5" fill="#484f58"/>
    <text x="975" y="76" class="term dim" text-anchor="middle" font-size="12">~/code</text>

    <text x="813" y="112" class="term l1"><tspan class="hi">$</tspan> npx @lechakrawarthy/vazr</text>
    <text x="813" y="138" class="term l2"><tspan class="ok">✔</tspan> scan complete <tspan class="dim">· 4 roots</tspan></text>
    <text x="829" y="162" class="term l3">node_modules<tspan x="975" class="hi">4.2 GB</tspan></text>
    <text x="829" y="182" class="term l4">build caches<tspan x="975" class="hi">1.3 GB</tspan></text>
    <text x="829" y="202" class="term l5">old downloads<tspan x="975" class="hi">0.8 GB</tspan></text>
    <text x="813" y="230" class="term l6"><tspan class="ok">~6.3 GB</tspan> reclaimable <tspan class="dim">· nothing deleted</tspan></text>
    <rect class="cursor" x="1124" y="219" width="8" height="15" fill="#f78166"/>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#30363d" stroke-width="2"/>
</svg>
