<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t"><title id="t">Log: 2026 Applied AI Fellow · AdMesh; 2026 Smart India Hackathon · top 50; 2026 Cognizant Technoverse · top 1,000 of 4,000+ teams; 2025 Software Engineer Intern · 99 Yards; 2025 Smart India Hackathon · top 35; 2024 President · GitHub Community GITAM</title><style>
:root{--bg:#0d1117;--card:#161b22;--chip:#21262d;--line:#30363d;--line2:#21262d;--fg:#e6edf3;--mute:#8b949e;--dim:#6e7681;--acc:#f78166;--ok:#3fb950}
@media (prefers-color-scheme: light){:root{--bg:#ffffff;--card:#f6f8fa;--chip:#eaeef2;--line:#d0d7de;--line2:#e6eaef;--fg:#1f2328;--mute:#59636e;--dim:#818b98;--acc:#cf4f2a;--ok:#1a7f37}}
.bg{fill:var(--bg)}.card{fill:var(--card);stroke:var(--line)}.chip{fill:var(--chip)}.ln{stroke:var(--line);fill:none}
.fg{fill:var(--fg)}.mute{fill:var(--mute)}.dim{fill:var(--dim)}.acc{fill:var(--acc)}.ok{fill:var(--ok)}
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
</style>
<rect x="1" y="1" width="958" height="428" rx="14" class="card" stroke-width="1.5"/><path d="M112 45V375" class="ln" stroke-width="2"/><text x="32" y="50" class="mono acc" font-size="13" font-weight="700" letter-spacing="1">2026</text><circle cx="112" cy="45" r="6" class="acc"/><text x="140" y="50" class="sans fg" font-size="16" font-weight="600">Applied AI Fellow · AdMesh</text><text x="140" y="73" class="sans mute" font-size="14">Built the decision-engine UI for AdPlex, an AI ad decision engine. New York, remote.</text><text x="32" y="116" class="mono acc" font-size="13" font-weight="700" letter-spacing="1">2026</text><circle cx="112" cy="111" r="5.5" style="fill:var(--card);stroke:var(--acc)" stroke-width="2"/><text x="140" y="116" class="sans fg" font-size="16" font-weight="600">Smart India Hackathon · top 50</text><text x="140" y="139" class="sans mute" font-size="14">QubitX, for NTRO's cryptographic discovery problem statement.</text><text x="32" y="182" class="mono acc" font-size="13" font-weight="700" letter-spacing="1">2026</text><circle cx="112" cy="177" r="5.5" style="fill:var(--card);stroke:var(--acc)" stroke-width="2"/><text x="140" y="182" class="sans fg" font-size="16" font-weight="600">Cognizant Technoverse · top 1,000 of 4,000+ teams</text><text x="140" y="205" class="sans mute" font-size="14">The only team shortlisted from GITAM.</text><text x="32" y="248" class="mono acc" font-size="13" font-weight="700" letter-spacing="1">2025</text><circle cx="112" cy="243" r="6" class="acc"/><text x="140" y="248" class="sans fg" font-size="16" font-weight="600">Software Engineer Intern · 99 Yards</text><text x="140" y="271" class="sans mute" font-size="14">React and Next.js for a fashion-tech platform. New York, remote.</text><text x="32" y="314" class="mono acc" font-size="13" font-weight="700" letter-spacing="1">2025</text><circle cx="112" cy="309" r="5.5" style="fill:var(--card);stroke:var(--acc)" stroke-width="2"/><text x="140" y="314" class="sans fg" font-size="16" font-weight="600">Smart India Hackathon · top 35</text><text x="140" y="337" class="sans mute" font-size="14">Blockchain traceability for Ayurveda supply chains.</text><text x="32" y="380" class="mono acc" font-size="13" font-weight="700" letter-spacing="1">2024</text><circle cx="112" cy="375" r="6" class="acc"/><text x="140" y="380" class="sans fg" font-size="16" font-weight="600">President · GitHub Community GITAM</text><text x="140" y="403" class="sans mute" font-size="14">Led a 28-person team, ran a 2,500-student tech fest, won Best Technical Club.</text>
